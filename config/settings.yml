pipeline:
  source: data/source
  raw: data/raw
  staging: data/staging
  curated: data/curated
  quarantine: data/quarantine
  benchmark: data/benchmarks
  partition: data/partitioned
  audit_timezone: UTC

storage_benchmark:
  repeats: 5
  json_lines: true
  filter_status: DELIVERED
  partition_columns: [order_year, order_month]

quality:
  allowed_order_statuses: [PENDING, PAID, PACKED, SHIPPED, DELIVERED, CANCELLED]
  min_quantity: 1
  max_quantity: 20
